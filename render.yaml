# SettleKit — Render Blueprint (Colosseum deployment).
#
# In Render: New -> Blueprint -> connect this repo. Render provisions the
# database and the five services buyers and sellers use:
#
#   settlekit-db         Postgres (api + worker + checkout share it)
#   settlekit-api        REST API (Docker, Node 22)       free
#   settlekit-worker     background jobs (Docker, Node 22) starter (~$7/mo):
#                        Render has no free background workers. The worker
#                        confirms payments, charges subscriptions, retries
#                        deliveries and sends seller webhooks; without it
#                        one-time checkout still works but renewals stop.
#   settlekit-checkout   hosted checkout + payment links (Next.js)  free
#   settlekit-dashboard  merchant dashboard (Next.js)                free
#   settlekit-web        marketing site + /docs/integrate (Next.js)  free
#
# Every Node build installs ONLY the app and its workspace dependencies
# (`pnpm install --filter <app>...`), so no unrelated app is installed or built.
# The other apps in the repo (marketplace, docs, portal, admin, consoles) are
# not part of this deployment.
#
# `sync: false` values are filled in the Render dashboard; every chain and
# integration fails closed until configured. Secrets marked generateValue are
# created once; shared ones are copied between services with fromService.
#
# After the first deploy, set the cross-service URLs (Render shows each
# service's onrender.com URL): NEXT_PUBLIC_API_URL / SETTLEKIT_API_URL -> api,
# NEXT_PUBLIC_CHECKOUT_URL / CHECKOUT_PUBLIC_URL / ONCHAIN_BILLING_CHECKOUT_URL
# -> checkout, NEXT_PUBLIC_DASHBOARD_URL -> dashboard.
#
# NOTE: do NOT create a plain Web Service pointing at the repo root; always
# deploy via Blueprint so each service gets its own build/start commands.

databases:
  - name: settlekit-db
    databaseName: settlekit
    user: settlekit
    plan: free

services:
  # ---- Backend API (Docker) -------------------------------------------------
  - type: web
    name: settlekit-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Migrations run on container start (see apps/api/Dockerfile CMD):
    # preDeployCommand is not available on the free plan.
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "8787"
      - key: DATABASE_URL
        fromDatabase:
          name: settlekit-db
          property: connectionString
      # Signing secrets (generated once).
      - key: LICENSE_TOKEN_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: AUTH_COOKIE_SECRET
        generateValue: true
      - key: FILE_DOWNLOAD_SECRET
        generateValue: true
      - key: API_BOOTSTRAP_KEY
        generateValue: true
      # Hosted checkout -> /v1/onchain-billing (subscriptions). Copied to the checkout.
      - key: SETTLEKIT_SERVICE_TOKEN
        generateValue: true
      # Platform fee: 1%, no fixed fee (DEFAULT_FEE_SCHEDULE). Keep equal to the web's NEXT_PUBLIC_PLATFORM_FEE_*.
      - key: PLATFORM_FEE_BPS
        value: "100"
      - key: PLATFORM_FEE_FIXED
        value: "0"
      - key: FILE_DOWNLOAD_BASE_URL
        sync: false
      - key: PROOF_EXCLUDED_ORGS
        sync: false
      # Arc testnet defaults (override for mainnet / another chain).
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: ARC_RPC_URL
        value: "https://rpc.testnet.arc.network"
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      # Multi-chain payments (fail closed until set; see .env.example).
      - key: SETTLEKIT_CHAIN_ENV
        sync: false
      - key: ENABLED_EVM_CHAINS
        sync: false
      - key: ETHEREUM_RPC_URL
        sync: false
      - key: ETHEREUM_NETWORK
        sync: false
      - key: ETHEREUM_MIN_CONFIRMATIONS
        sync: false
