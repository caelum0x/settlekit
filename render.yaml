      - key: ARBITRUM_MIN_CONFIRMATIONS
        sync: false
      - key: ROBINHOOD_RPC_URL
        sync: false
      - key: ROBINHOOD_NETWORK
        sync: false
      - key: ROBINHOOD_MIN_CONFIRMATIONS
        sync: false
      - key: HYPEREVM_RPC_URL
        sync: false
      - key: HYPEREVM_NETWORK
        sync: false
      - key: HYPEREVM_MIN_CONFIRMATIONS
        sync: false
      - key: TEMPO_RPC_URL
        sync: false
      - key: TEMPO_NETWORK
        sync: false
      - key: TEMPO_MIN_CONFIRMATIONS
        sync: false
      - key: SOLANA_CLUSTER
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_USDC_MINT
        sync: false
      - key: ZCASH_ENABLED
        sync: false
      - key: ZCASH_EXPLORER_URL
        sync: false
      - key: BLOCKCHAIR_API_KEY
        sync: false
      - key: ZCASH_MIN_CONFIRMATIONS
        sync: false
      - key: ZCASH_QUOTE_TTL_SEC
        sync: false
      - key: HYPERCORE_ENABLED
        sync: false
      - key: HYPERCORE_NETWORK
        sync: false
      - key: HYPERCORE_API_URL
        sync: false
      # Route watching (same values as the API).
      - key: ROUTING_ENABLED
        sync: false
      - key: RELAY_API_KEY
        sync: false
      - key: RELAY_API_URL
        sync: false
      - key: LIFI_ENABLED
        sync: false
      - key: LIFI_API_KEY
        sync: false
      - key: LIFI_INTEGRATOR
        sync: false
      - key: ROUTE_MAX_FEE_BPS
        sync: false
      - key: ROUTE_MAX_SLIPPAGE_BPS
        sync: false
      - key: ROUTE_QUOTE_TTL_SEC
        sync: false
      - key: ROUTE_ORIGIN_ALLOWLIST
        sync: false
      - key: ROUTE_APP_FEE_BPS
        sync: false
      - key: ROUTE_APP_FEE_RECIPIENT
