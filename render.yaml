  # ---- Merchant dashboard -----------------------------------------------------
  - type: web
    name: settlekit-dashboard
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter settlekit --filter "@settlekit/dashboard..." && pnpm --filter "@settlekit/dashboard..." build
    # `next start` must bind Render's injected $PORT.
    startCommand: pnpm --filter @settlekit/dashboard exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_CHECKOUT_URL
        sync: false
      - key: NEXT_PUBLIC_DISCORD_CLIENT_ID
        sync: false

  # ---- Marketing site + integration docs --------------------------------------
  - type: web
    name: settlekit-web
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter settlekit --filter "@settlekit/web..." && pnpm --filter "@settlekit/web..." build
    # `next start` must bind Render's injected $PORT.
    startCommand: pnpm --filter @settlekit/web exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_CHECKOUT_URL
        sync: false
      - key: NEXT_PUBLIC_DASHBOARD_URL
        sync: false
      - key: NEXT_PUBLIC_DOCS_URL
        sync: false
      # Mirrors the API's platform fee (1%, no fixed fee).
      - key: NEXT_PUBLIC_PLATFORM_FEE_BPS
        value: "100"
      - key: NEXT_PUBLIC_PLATFORM_FEE_FIXED
        value: "0"
