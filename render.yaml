  # ---- Checkout (buyers: pay, subscribe, manage) ------------------------------
  - type: web
    name: settlekit-checkout
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter settlekit --filter "@settlekit/checkout-app..." && pnpm --filter "@settlekit/checkout-app..." build
    # `next start` must bind Render's injected $PORT.
    startCommand: pnpm --filter @settlekit/checkout-app exec next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: settlekit-db
          property: connectionString
      - key: CHECKOUT_PUBLIC_URL
        sync: false
      - key: SETTLEKIT_API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # Subscriptions: same token as the API; the checkout calls /v1/onchain-billing server-side.
      - key: SETTLEKIT_SERVICE_TOKEN
        fromService:
          name: settlekit-api
          type: web
          envVarKey: SETTLEKIT_SERVICE_TOKEN
      - key: CHECKOUT_MANAGE_SECRET
        generateValue: true
      - key: CHECKOUT_DELIVERY_SECRET
        generateValue: true
      - key: CHECKOUT_DOWNLOAD_BASE
        sync: false
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: ARC_RPC_URL
        value: "https://rpc.testnet.arc.network"
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      # Multi-chain payments (same values as the API).
      - key: SETTLEKIT_CHAIN_ENV
        sync: false
      - key: ENABLED_EVM_CHAINS
        sync: false
      - key: ETHEREUM_RPC_URL
        sync: false
      - key: ETHEREUM_NETWORK
        sync: false
      - key: ETHEREUM_MIN_CONFIRMATIONS
        sync: false
      - key: BASE_RPC_URL
        sync: false
      - key: BASE_NETWORK
        sync: false
      - key: BASE_MIN_CONFIRMATIONS
        sync: false
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ARBITRUM_NETWORK
        sync: false
      - key: ARBITRUM_MIN_CONFIRMATIONS
        sync: false
      - key: ROBINHOOD_RPC_URL
        sync: false
      - key: ROBINHOOD_NETWORK
        sync: false
      - key: ROBINHOOD_MIN_CONFIRMATIONS
        sync: false
      - key: HYPEREVM_RPC_URL
        sync: false
      - key: HYPEREVM_NETWORK
        sync: false
      - key: HYPEREVM_MIN_CONFIRMATIONS
        sync: false
      - key: TEMPO_RPC_URL
        sync: false
      - key: TEMPO_NETWORK
        sync: false
      - key: TEMPO_MIN_CONFIRMATIONS
        sync: false
      - key: SOLANA_CLUSTER
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_USDC_MINT
        sync: false
      - key: ZCASH_ENABLED
        sync: false
      - key: ZCASH_EXPLORER_URL
        sync: false
      - key: BLOCKCHAIR_API_KEY
        sync: false
      - key: ZCASH_MIN_CONFIRMATIONS
        sync: false
      - key: ZCASH_QUOTE_TTL_SEC
        sync: false
      - key: HYPERCORE_ENABLED
        sync: false
      - key: HYPERCORE_NETWORK
        sync: false
      - key: HYPERCORE_API_URL
        sync: false
      # Pay with any token.
      - key: ROUTING_ENABLED
        sync: false
      - key: RELAY_API_KEY
        sync: false
      - key: RELAY_API_URL
        sync: false
      - key: LIFI_ENABLED
        sync: false
      - key: LIFI_API_KEY
        sync: false
      - key: LIFI_INTEGRATOR
        sync: false
      - key: ROUTE_MAX_FEE_BPS
        sync: false
      - key: ROUTE_MAX_SLIPPAGE_BPS
        sync: false
      - key: ROUTE_QUOTE_TTL_SEC
        sync: false
      - key: ROUTE_ORIGIN_ALLOWLIST
        sync: false
      - key: ROUTE_APP_FEE_BPS
        sync: false
      - key: ROUTE_APP_FEE_RECIPIENT
        sync: false
      # Delivery: GitHub App, Discord bot + OAuth app (Connect Discord).
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
