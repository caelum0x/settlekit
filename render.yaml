  # ---- Background worker (Docker) -------------------------------------------
  # Render background workers have no free plan; starter is the cheapest.
  - type: worker
    name: settlekit-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: settlekit-db
          property: connectionString
      # Shared with the API.
      - key: WEBHOOK_SIGNING_SECRET
        fromService:
          name: settlekit-api
          type: web
          envVarKey: WEBHOOK_SIGNING_SECRET
      - key: LICENSE_TOKEN_SECRET
        fromService:
          name: settlekit-api
          type: web
          envVarKey: LICENSE_TOKEN_SECRET
      - key: FILE_DELIVERY_SECRET
        fromService:
          name: settlekit-api
          type: web
          envVarKey: FILE_DOWNLOAD_SECRET
      - key: FILE_DELIVERY_BASE_URL
        sync: false
      - key: ARC_CHAIN_ID
        value: "5042002"
      - key: ARC_RPC_URL
        value: "https://rpc.testnet.arc.network"
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      # Multi-chain payments (same values as the API).
      - key: SETTLEKIT_CHAIN_ENV
        sync: false
      - key: ENABLED_EVM_CHAINS
        sync: false
      - key: ETHEREUM_RPC_URL
        sync: false
      - key: ETHEREUM_NETWORK
        sync: false
