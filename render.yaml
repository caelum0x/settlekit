        sync: false
      # Pay with any token (Relay / LI.FI).
      - key: ROUTING_ENABLED
        sync: false
      - key: RELAY_API_KEY
        sync: false
      - key: RELAY_API_URL
        sync: false
      - key: LIFI_ENABLED
        sync: false
      - key: LIFI_API_KEY
