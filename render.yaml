      - key: MPP_SECRET_KEY
        sync: false
      - key: MPP_TEMPO_RECIPIENT
        sync: false
      # Onchain billing: subscriptions, Base escrow, operator refunds.
      - key: ONCHAIN_BILLING_OPERATOR_PRIVATE_KEY
        sync: false
      - key: ONCHAIN_BILLING_SOLANA_SECRET
        sync: false
      - key: ONCHAIN_BILLING_NETWORKS
        sync: false
      - key: ONCHAIN_BILLING_ESCROW
        sync: false
      - key: ONCHAIN_BILLING_CHECKOUT_URL
        sync: false
      - key: HYPERCORE_REFUND_PRIVATE_KEY
        sync: false
